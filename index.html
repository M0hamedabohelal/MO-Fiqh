    <!-- ضبط الثيم فوراً قبل أول رسم للصفحة لمنع وميض الثيم الفاتح (الداكن هو الافتراضي) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'sepia' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
