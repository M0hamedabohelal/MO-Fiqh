    <!-- ضبط الثيم فوراً قبل أول رسم للصفحة لمنع وميض الثيم الفاتح (الداكن هو الافتراضي) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'sepia' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

  <body>
    <!-- تنظيف آثار الـ PWA القديمة (مرة واحدة لكل متصفح) -->
    <!-- الموقع صار ويب عاديًا، لكن زوّار ما قبل الإزالة ما زال عندهم Service Worker مسجَّل -->
    <!-- وذاكرة كاش تحرس مسار الصفحة. النتيجة: يفتحون رابطًا فيرون نسخة قديمة جدًا، ولا -->
    <!-- تُحدَّث إلا بريفرش قسري. إلغاء التسجيل + مسح الكاش مرة واحدة يحلّها نهائيًا. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('sw-cleared') === '1') return;
          var done = function () { try { localStorage.setItem('sw-cleared', '1'); } catch (e) {} };
          if (!('serviceWorker' in navigator)) { done(); return; }
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs.length) { done(); return; }
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (!window.caches) return null;
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                });
              })
              .then(function () {
                done();
                // إعادة التحميل مرة واحدة حتى لا يبقى المستخدم على صفحة قديمة في الذاكرة
                if (!sessionStorage.getItem('sw-reloaded')) {
                  sessionStorage.setItem('sw-reloaded', '1');
                  location.reload();
                }
              })
              .catch(done);
          }).catch(done);
        } catch (e) { /* بيئة بلا تخزين — لا شيء يُنظَّف */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
