<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ضبط الثيم فوراً قبل أول رسم للصفحة لمنع وميض الثيم الفاتح (الداكن هو الافتراضي) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'sepia' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="description" content="الباحث الفقهي - منصة تعليمية متكاملة لدراسة الفقه الإسلامي بأسلوب عصري ميسّر" />
    <link rel="canonical" href="https://www.fqh.me/" />
    <title>الباحث الفقهي</title>
    <meta name="google" content="notranslate">

    <!-- الخطوط: روابط مباشرة + preconnect بدل @import (أسرع بكثير على شبكات الفون) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- اتصالات مبكرة للسحابة والفيديو (تُستخدم بعد التحميل مباشرة) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://img.youtube.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap"
      />
    </noscript>

    <!-- معاينة المشاركة الجميلة (WhatsApp / Telegram / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="الباحث الفقهي" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="الباحث الفقهي — منصة تعليم الفقه الإسلامي" />
    <meta property="og:description" content="منصة تعليمية متكاملة لدراسة الفقه الإسلامي بأسلوب عصري ميسّر" />
    <meta property="og:image" content="https://www.fqh.me/og-image.jpg" />
    <meta property="og:url" content="https://www.fqh.me/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="الباحث الفقهي — منصة تعليم الفقه الإسلامي" />
    <meta name="twitter:description" content="منصة تعليمية متكاملة لدراسة الفقه الإسلامي بأسلوب عصري ميسّر" />
    <meta name="twitter:image" content="https://www.fqh.me/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
