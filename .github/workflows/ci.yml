# فحص تلقائي عند كل دفع — يمنع دمج كود مكسور إلى main
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # تكامل حقيقي على مقاس فون: DOM + شبكة + حفظ بعد إعادة التحميل.
  # يعمل على نسخة الإنتاج المحلية (dist) لا على الموقع المنشور.
  #
  # يحتاج إعداد Firebase في وقت التشغيل (الاختبارات تقرأ المحتوى من السحابة،
  # والمسار لا يستخدم اللقطة المحلية). القيم عامة بطبيعتها — تُشحن داخل حزمة
  # الموقع — فتُحفظ كـ«متغيّرات مستودع» (Variables) لا أسرار، لأن `secrets`
  # غير متاح داخل `if` (يرفضه GitHub: Unrecognized named-value: 'secrets').
  # بدونها تُتخطّى المهمة بدل أن تفشل: الإعداد في Settings → Secrets and
  # variables → Actions → Variables.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.VITE_FIREBASE_API_KEY != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Write Firebase config for build/runtime
        run: |
          cat > .env.local <<EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          EOF

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
