# نسخة احتياطية يومية مجدولة لقاعدة بيانات Firestore
name: Scheduled Backup

on:
  schedule:
    # يومياً الساعة 02:00 بتوقيت UTC
    - cron: '0 2 * * *'
  # إتاحة التشغيل اليدوي من تبويب Actions
  workflow_dispatch:

concurrency:
  group: firestore-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write Firebase config
        run: |
          cat > .env.local <<EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          EOF

      - name: Run Firestore Backup
        run: npm run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backups
          path: backups/
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "### 🛡️ اكتمل النسخ الاحتياطي اليومي بنجاح" >> "$GITHUB_STEP_SUMMARY"
          echo "تم حفظ النسخة في مسار \`backups/\` ورفعها كـ Artifact لمدة 30 يومًا." >> "$GITHUB_STEP_SUMMARY"
