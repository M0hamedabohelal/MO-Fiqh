<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>الصفحة غير موجودة (404) | يَسِّر</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png">
  <!-- الثيم قبل الرسم: نفس مفاتيح التطبيق (theme في localStorage) + تفضيل النظام -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark' && t !== 'sepia') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    /* الافتراضي داكن (ليطابق الوضع الداكن الافتراضي في التطبيق)، ويُبدَّل عبر data-theme
       المكتوب بـJS من localStorage قبل الرسم — نفس توكنات التطبيق حرفيًا. */
    :root,
    html[data-theme="dark"] {
      --bg: #101414;
      --card-bg: rgba(26, 32, 32, 0.85);
      --border: rgba(255, 255, 255, 0.09);
      --text: #e6e8e6;
      --muted: #a9b1ad;
      --primary: #5cc0b5;
      --primary-hover: #74d0c5;
      --btn-secondary-bg: rgba(255, 255, 255, 0.05);
      --btn-secondary-border: rgba(255, 255, 255, 0.15);
      --accent: #d8a06a;
    }
    html[data-theme="light"] {
      --bg: #fafaf7;
      --card-bg: #ffffff;
      --border: #eeeeee;
      --text: #2c2c2c;
      --muted: #595959;
      --primary: #0f3d3e;
      --primary-hover: #0c3834;
      --btn-secondary-bg: #f8f9fa;
      --btn-secondary-border: #e9ecef;
      --accent: #966816;
    }
    html[data-theme="sepia"] {
      --bg: #f5efe3;
      --card-bg: #fdfaf3;
      --border: #e3d7c2;
      --text: #3b332a;
      --muted: #66503f;
      --primary: #8a5a1b;
      --primary-hover: #6f4916;
      --btn-secondary-bg: #f7f0e4;
      --btn-secondary-border: #e3d7c2;
      --accent: #8a5a1b;
    }
    html[data-theme="light"] body,
    html[data-theme="sepia"] body { background-color: var(--bg); }
    html[data-theme="light"] .btn-secondary:hover { background-color: #eef0f0; }
    html[data-theme="sepia"] .btn-secondary:hover { background-color: #f0e6d4; }
    html[data-theme="light"] .container { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      line-height: 1.7;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 44px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge-404 {
      display: inline-block;
      font-size: 5rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      font-family: system-ui, sans-serif;
      text-shadow: 0 0 30px rgba(216, 160, 106, 0.3);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #0b1219;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--text);
      border: 1px solid var(--btn-secondary-border);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge-404">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذرًا، المسألة أو الصفحة التي طلبتها غير متوفرة أو ربما تم تغيير مسارها.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">الصفحة الرئيسية</a>
      <a href="/#/books" class="btn btn-secondary">فهرس الكتب</a>
      <a href="/#/lessons" class="btn btn-secondary">كل المسائل</a>
    </div>
  </div>
</body>
</html>
